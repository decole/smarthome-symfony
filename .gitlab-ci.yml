deploy_prod:
  stage: deploy
  tags:
    - smarthome
  script:
    - df -H /
    - cd /var/www/smarthome/
    - git checkout master
    - git fetch --all
    - git reset --hard HEAD
    - git status
    - git pull
    - df -H
  dependencies:
    - tests-testing
  environment:
    name: deploy
  only:
    - master
