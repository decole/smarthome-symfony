default:
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - vendor/

stages:
  - manual-clean
#  - lint
#  - build
#  - compose
  - testing
  - deploy

variables:
  DB_HOST: $DB_HOST

test-build:
  stage: testing
  tags:
    - smarthome
  script:
    - docker build -f docker/php/DockerfileCommands -t commands-test .
    - docker compose -f docker-compose.ci.yaml build php
    - docker compose -f docker-compose.ci.yaml down --remove-orphans
    - cp -n .env.test .env.test.local
#    - sed -i 's/uberserver/'"$DB_HOST"'/g' .env
#    - sed -i 's/uberserver/'"$DB_HOST"'/g' .env.test.local
    - docker compose -f docker-compose.ci.yaml up -d

test-compose:
  stage: testing
  interruptible: true
  tags:
    - smarthome
  dependencies:
    - test-build
  script:
    - docker compose -f docker-compose.ci.yaml run -T php composer install --prefer-dist --no-ansi --no-interaction --no-progress
    - docker compose -f docker-compose.ci.yaml run -T php php -v

tests-testing:
  stage: testing
  tags:
    - smarthome
  dependencies:
    - test-compose
  script:
    - docker compose -f docker-compose.ci.yaml run -T php php bin/console d:d:d --force --env=test
    - docker compose -f docker-compose.ci.yaml run -T php php bin/console d:d:c --env=test
    - docker compose -f docker-compose.ci.yaml run -T php php bin/console d:m:m --no-interaction --env=test
    - docker compose -f docker-compose.ci.yaml run -T php ./vendor/codeception/codeception/codecept build
    - docker compose -f docker-compose.ci.yaml run -T php ./vendor/codeception/codeception/codecept run --steps
    - docker compose -f docker-compose.ci.yaml run -T php ./vendor/codeception/codeception/codecept clean
    - docker compose -f docker-compose.ci.yaml down --remove-orphans
